[package]
name = "jarvis"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "JARVIS AI - native Rust Windows desktop assistant"
license = "MIT"
build = "build.rs"

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "backend-default", "renderer-software", "compat-1-2"] }
keyring = { version = "4", default-features = false, features = ["v1", "windows-native-keyring-store"] }
rusqlite = { version = "0.43", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true